services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-container
    restart: unless-stopped
    # Single config file for the whole project: the image reads POSTGRES_USER,
    # POSTGRES_PASSWORD and POSTGRES_DB from it. Trade-off (local dev): the container
    # also receives the file's other variables (API keys) it doesn't need.
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
